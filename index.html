<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3d3b3a" />
    <meta name="description" content="Explore five centuries of Hyderabad through an interactive, source-linked 3D time atlas. An interpretive historical reconstruction, not a survey." />
    <title>Hyderabad, Through Time — An Interactive City Atlas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='none' stroke='currentColor' stroke-width='5' d='M12 54V12m40 42V12M12 26h40M24 54V42a8 8 0 0 1 16 0v12M8 54h48M8 12h8m32 0h8'/%3E%3C/svg%3E" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
